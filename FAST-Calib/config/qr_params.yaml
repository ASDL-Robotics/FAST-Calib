fast_calib:
  ros__parameters:
    # Camera intrinsics — replace with your calibrated values
    fx: 0.0
    fy: 0.0
    cx: 0.0
    cy: 0.0
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0

    # Calibration target parameters
    marker_size: 0.16           # ArUco marker size in meters
    delta_width_qr_center: 0.47 # Half the horizontal distance between marker centers
    delta_height_qr_center: 0.27 # Half the vertical distance between marker centers
    delta_width_circles: 0.4    # Horizontal distance between circle centers
    delta_height_circles: 0.3   # Vertical distance between circle centers
    circle_radius: 0.10         # Radius of the circular holes

    # Distance filter — adjust to frame the calibration target
    x_min: 1.5
    x_max: 3.0
    y_min: -1.5
    y_max: 2.0
    z_min: -0.5
    z_max: 2.0

    # Input — set these to your actual file paths
    lidar_topic: "/livox/lidar"  # e.g. /ouster/points, /livox/lidar
    bag_path: "/path/to/input.bag"
    image_path: "/path/to/image.png"

    # Output
    output_path: "/path/to/output"

    # Minimum number of ArUco markers that must be detected
    min_detected_markers: 3
